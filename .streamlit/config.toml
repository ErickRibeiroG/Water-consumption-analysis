# Tema claro e escuro: o usuário escolhe em ⋮ → Settings (ou segue o sistema operacional).
[theme]
primaryColor = "#2a78d6"
font = "Comfortaa:https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap, sans-serif"
codeFont = "monospace"

[theme.light]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f2f1ec"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
